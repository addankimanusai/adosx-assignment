services:
  # 1. Django Backend REST API Service
  - type: web
    name: dealeros-backend
    runtime: python
    plan: free
    branch: main
    rootDir: backend
    buildCommand: "pip install -r ../requirements.txt && python manage.py migrate && python manage.py import_data"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.3

  # 2. React Frontend Static Site
  - type: web
    name: dealeros-frontend
    runtime: static
    plan: free
    branch: main
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
